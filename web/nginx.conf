server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx drops every server-level add_header in a location that declares
    # its own, so the security headers are repeated per location (via the
    # variable below) rather than set once at server level. Without this,
    # index.html -- the one document that needs them -- was served bare.
    #
    # CSP: scripts only from this origin, which is what keeps the refresh
    # token in localStorage out of reach of injected third-party script.
    # connect-src allows https: because the API and the object store's
    # presigned upload URLs live on deployment-specific origins.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    # Hashed asset filenames are immutable; the entry document never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routing: unknown paths are React Router's problem, not a 404.
    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

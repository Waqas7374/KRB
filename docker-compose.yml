name: krb-erp

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: krb-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krb_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-krb_erp}
      # Deterministic collation so index ordering matches across machines
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # Host port is configurable so the stack can coexist with another
      # local PostgreSQL. Containers always talk to db:5432 internally.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krb} -d ${POSTGRES_DB:-krb_erp}"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=500

  redis:
    image: redis:7-alpine
    container_name: krb-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: krb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: krb-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-krb-erp} &&
      echo 'bucket ready'
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: krb-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  api:
    build:
      context: ./backend
      target: development
    container_name: krb-api
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-krb}:${POSTGRES_PASSWORD:-krb_dev_password}@db:5432/${POSTGRES_DB:-krb_erp}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-krb}:${POSTGRES_PASSWORD:-krb_dev_password}@db:5432/${POSTGRES_DB:-krb_erp}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_ENDPOINT_URL: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
      target: development
    container_name: krb-worker
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-krb}:${POSTGRES_PASSWORD:-krb_dev_password}@db:5432/${POSTGRES_DB:-krb_erp}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-krb}:${POSTGRES_PASSWORD:-krb_dev_password}@db:5432/${POSTGRES_DB:-krb_erp}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_ENDPOINT_URL: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --beat --loglevel=info --concurrency=2

  web:
    build:
      context: ./web
      target: development
    container_name: krb-web
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      # Keep the image's node_modules; the host's are built for Windows.
      - /app/node_modules
    depends_on:
      - api

volumes:
  db_data:
  redis_data:
  minio_data:

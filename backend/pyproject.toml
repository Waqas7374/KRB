[project]
name = "krb-erp-backend"
version = "0.1.0"
description = "KRB ERP — land development ERP backend"
requires-python = ">=3.12"

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.12",

    # Data
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "geoalchemy2>=0.16.0",
    "shapely>=2.0.6",

    # Validation / settings
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # Security
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",

    # Infrastructure
    "redis>=5.2.0",
    "celery>=5.4.0",
    "boto3>=1.35.0",
    "httpx>=0.27.2",

    # Observability
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.18.0",
    "prometheus-fastapi-instrumentator>=7.0.0",

    # Utilities
    "uuid-utils>=0.10.0",
    "python-dateutil>=2.9.0",
    "babel>=2.16.0",
    "openpyxl>=3.1.5",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
# PDF rendering needs native cairo/pango libraries. Installed in the Docker
# image and on the server, kept out of the base set so a bare Windows dev
# machine can install the backend without a C toolchain.
pdf = [
    "weasyprint>=63.0",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-randomly>=3.16.0",
    "anyio>=4.6.0",
    "faker>=30.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
    "types-python-dateutil",
    "pip-audit>=2.7.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # flake8-datetimez — naive datetimes are a real bug class here
    "T20",       # no print()
    "SIM",       # simplify
    "RUF",
    "ASYNC",
    "S",         # bandit
    "BLE",       # no bare/blind except
]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI Depends() in defaults is the documented pattern
    "N811",   # `UUID as PgUUID` is the conventional SQLAlchemy dialect alias
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S311"]
"alembic/*" = ["E501", "N999", "F401"]
# Enum members named *PASSWORD* are status values, not credentials.
"app/modules/*/domain/enums.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# -----------------------------------------------------------------------------
# mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_untyped_decorators = false
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "celery.*", "weasyprint.*", "uuid_utils.*", "shapely.*"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires a live database",
    "authz: authorisation matrix tests",
    "slow: excluded from the fast feedback loop",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
# Bootstrap and wiring code: exercised by starting the process, not by unit
# tests. Covering it would mean asserting that configuration equals itself.
omit = [
    "app/main.py",
    "alembic/*",
    "app/seeds/*",
    "app/core/logging.py",
    "app/models_registry.py",
    "app/workers/celery_app.py",
    "app/workers/tasks/*",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

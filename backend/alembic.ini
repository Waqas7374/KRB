[alembic]
script_location = alembic
prepend_sys_path = .
# Explicit, so alembic does not fall back to splitting on spaces and colons.
path_separator = os
# The URL is supplied at runtime from Settings (alembic/env.py); this key is
# left empty on purpose so credentials never live in a committed file.
sqlalchemy.url =

# Timestamped, readable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 48

# One head. Branching migrations in a single-team ERP cause more pain than they
# solve; conflicts are resolved by rebasing the migration, not by merging heads.
revision_environment = false

# `exec` rather than `console_scripts`: ruff ships a native binary, not a
# Python entry point, so alembic cannot import it.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
